services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # Redis protocol
      - "3000:3000"   # FalkorDB browser
    volumes:
      - ./falkordb-data:/data
    restart: unless-stopped

  app:
    build: .
    profiles: ["app"]   # `docker compose --profile app up` runs the full stack
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      - falkordb
