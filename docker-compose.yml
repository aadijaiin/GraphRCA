services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # Redis protocol
      - "3000:3000"   # FalkorDB browser
    volumes:
      - ./falkordb-data:/data
    restart: unless-stopped

  app:
    build: .
    profiles: ["app"]   # `docker compose --profile app up` runs the full stack
    env_file:           # model settings (LOCAL_*, BRAIN_*, keys) from your .env, same as the CLI; never committed
      - path: .env
        required: false
    environment:        # these win over .env: inside compose, FalkorDB is the "falkordb" service
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      - falkordb
